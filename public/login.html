<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>로그인 - 재고·발주 관리 시스템</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0d1117; --surface: #161b22; --border: #30363d;
      --text: #e6edf3; --muted: #8b949e; --accent: #0055A5; --danger: #f85149;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Noto Sans KR', Arial, sans-serif;
      background: var(--bg); color: var(--text);
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
    }
    .wrap {
      width: 100%; max-width: 400px; padding: 24px;
    }
    .logo {
      text-align: center; margin-bottom: 36px;
    }
    .logo-icon { font-size: 48px; display: block; margin-bottom: 12px; }
    .logo-title { font-size: 1.4rem; font-weight: 700; }
    .logo-sub   { font-size: 13px; color: var(--muted); margin-top: 4px; }
    .card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 14px; padding: 32px;
    }
    .card h2 { font-size: 1.1rem; font-weight: 700; margin-bottom: 6px; }
    .card p  { font-size: 13px; color: var(--muted); margin-bottom: 24px; }
    label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
    input[type=password] {
      width: 100%; background: var(--bg); border: 1px solid var(--border);
      color: var(--text); padding: 11px 14px; border-radius: 8px;
      font-family: inherit; font-size: 15px; letter-spacing: 2px;
    }
    input[type=password]:focus { outline: none; border-color: #1a8cff; }
    .btn {
      width: 100%; margin-top: 16px; padding: 13px;
      background: var(--accent); color: #fff; border: none; border-radius: 8px;
      font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer;
      transition: background .2s;
    }
    .btn:hover { background: #0066c7; }
    .btn:disabled { opacity: .6; cursor: not-allowed; }
    .error {
      margin-top: 12px; padding: 10px 14px;
      background: rgba(248,81,73,.12); border: 1px solid rgba(248,81,73,.3);
      border-radius: 8px; color: var(--danger); font-size: 13px; text-align: center;
      display: none;
    }
    .spinner {
      display: inline-block; width: 16px; height: 16px;
      border: 2px solid rgba(255,255,255,.3); border-top-color: #fff;
      border-radius: 50%; animation: spin .7s linear infinite; vertical-align: middle;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="logo">
      <span class="logo-icon">🍕</span>
      <div class="logo-title">재고·발주 관리 시스템</div>
      <div class="logo-sub">도미노피자 운영 전용</div>
    </div>
    <div class="card">
      <h2>팀 로그인</h2>
      <p>팀 비밀번호를 입력해 주세요.</p>
      <div>
        <label for="pw">비밀번호</label>
        <input type="password" id="pw" placeholder="••••••••" autofocus
               onkeydown="if(event.key==='Enter') login()">
      </div>
      <button class="btn" id="loginBtn" onclick="login()">로그인</button>
      <div class="error" id="errMsg"></div>
    </div>
  </div>
  <script>
    async function login() {
      const pw  = document.getElementById('pw').value;
      const btn = document.getElementById('loginBtn');
      const err = document.getElementById('errMsg');
      if (!pw) { err.style.display='block'; err.textContent='비밀번호를 입력해 주세요.'; return; }

      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span> 로그인 중...';
      err.style.display = 'none';

      try {
        const res  = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: pw }),
        });
        const data = await res.json();
        if (res.ok) {
          window.location.href = '/';
        } else {
          err.style.display = 'block';
          err.textContent   = data.error || '로그인 실패';
          btn.disabled      = false;
          btn.textContent   = '로그인';
          document.getElementById('pw').select();
        }
      } catch (e) {
        err.style.display = 'block';
        err.textContent   = '서버 오류가 발생했습니다.';
        btn.disabled      = false;
        btn.textContent   = '로그인';
      }
    }
  </script>
</body>
</html>
